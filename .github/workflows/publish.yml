name: Publish MCP
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HOLDOUT_DATA_BASE: https://data.holdout.codes
      HOLDOUT_SITE_BASE: https://holdout.codes
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.11.1
          registry-url: https://registry.npmjs.org
      - uses: foundry-rs/foundry-toolchain@8b0419c685ef46cb79ec93fbdc131174afceb730 # v1.6.0
        with:
          version: v1.7.1
          cache: false
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm publish -w holdout-mcp --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
